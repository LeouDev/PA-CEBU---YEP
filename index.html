<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PA Cebu Leadership Year End Party · Register Now</title>
    <meta name="description" content="Sun, Dec 6, 2026 · 10 PM – 1 AM at Chamber KTV, The Terraces, Ayala Center Cebu. Walk through the venue in 3D and RSVP." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pa-cebu-yep.vercel.app/" />
    <meta property="og:title" content="PA Cebu Leadership Year End Party · Register Now" />
    <meta property="og:description" content="Sun, Dec 6, 2026 · 10 PM – 1 AM at Chamber KTV, The Terraces, Ayala Center Cebu. Walk through the venue in 3D and RSVP." />
    <meta property="og:image" content="https://pa-cebu-yep.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PA Cebu Leadership Year End Party, Dec 6 2026, 10 PM to 1 AM, Chamber KTV, The Terraces Ayala Center Cebu. Register now." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://pa-cebu-yep.vercel.app/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
    <style>
      /* Venue title: slanted heavy type with a sunset gradient */
      .venue-title { position: fixed; left: 22px; top: 14px; z-index: 12; pointer-events: none; display: flex; flex-direction: column; align-items: flex-start; }
      .venue-title h1 { margin: 2px 0 0; font: 400 58px/.95 Anton, Impact, sans-serif; letter-spacing: .02em; transform: skewX(-10deg); transform-origin: left bottom;
        background: linear-gradient(180deg, #ffe36e 0%, #ffb14a 40%, #ff4f8b 75%, #c23bff 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(3px 3px 0 #1a0828) drop-shadow(0 0 16px rgba(255,47,142,.45)); }
      .vt-kicker, .vt-sub { font: 700 11px/1.3 ui-monospace, Menlo, monospace; letter-spacing: .22em; color: #ffd3a1; text-shadow: 0 1px 6px rgba(0,0,0,.9); }
      .vt-sub { margin-top: 4px; color: #ff9ccc; letter-spacing: .14em; font-size: 10px; }
      .countdown { display: flex; gap: 6px; margin-top: 8px; transform: skewX(-10deg); transform-origin: left bottom; }
      .countdown span { display: flex; flex-direction: column; align-items: center; min-width: 46px; padding: 4px 6px 3px;
        background: rgba(18,8,31,.72); border: 1px solid rgba(255,79,139,.55); border-radius: 3px; box-shadow: 3px 3px 0 #1a0828; }
      .countdown b { font: 400 26px/1 Anton, Impact, sans-serif; color: #fff; font-variant-numeric: tabular-nums; }
      .countdown small { font: 700 8px/1.4 ui-monospace, Menlo, monospace; letter-spacing: .18em; color: #5be3ff; }
      .countdown.live-now, .countdown.done { font: 400 18px/1 Anton, Impact, sans-serif; letter-spacing: .06em; padding: 6px 10px;
        background: #ff2f8e; color: #fff; box-shadow: 3px 3px 0 #1a0828; }
      .countdown.done { background: rgba(18,8,31,.8); color: #ffd3a1; }
      @media (max-width: 760px), (pointer: coarse) {
        .countdown span { min-width: 38px; padding: 3px 4px 2px; }
        .countdown b { font-size: 20px; }
        .countdown.live-now, .countdown.done { font-size: 14px; }
        .venue-title { left: 12px; top: 92px; }
        .venue-title h1 { font-size: 40px; }
        .vt-kicker { font-size: 9px; }
        .vt-sub { font-size: 8.5px; }
      }
      html, body, #root { margin: 0; height: 100%; background: #0b0b0c; overflow: hidden; }
      body { font-family: ui-monospace, Menlo, monospace; color: #eee; }
      .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8,8,10,.62); backdrop-filter: blur(3px); z-index: 10; }
      .card { max-width: 420px; padding: 28px 32px; background: rgba(20,18,16,.92); border: 1px solid #5a4a38; border-radius: 6px; text-align: center; }
      .card h1 { font-size: 18px; letter-spacing: .2em; margin: 0 0 16px; color: #d9b98a; }
      .card table { margin: 0 auto 20px; font-size: 13px; border-spacing: 12px 4px; text-align: left; }
      .card td:first-child { color: #d9b98a; text-align: right; }
      button { font: inherit; font-size: 12px; letter-spacing: .1em; background: #2a241e; color: #eee; border: 1px solid #6b5843; border-radius: 4px; padding: 8px 14px; cursor: pointer; }
      button:hover { background: #3a3128; }
      button.primary { background: #b08a58; color: #111; border-color: #b08a58; font-weight: 700; padding: 10px 22px; }
      .bar { position: fixed; top: 12px; right: 12px; display: flex; gap: 8px; z-index: 20; }
      .hint { position: fixed; left: 12px; bottom: 12px; font-size: 11px; opacity: .7; z-index: 5; }
      .crosshair { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; transform: translate(-50%,-50%); pointer-events: none; z-index: 5; }
      .crosshair::before, .crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,.85); }
      .crosshair::before { left: 6px; top: 0; width: 2px; height: 14px; }
      .crosshair::after { top: 6px; left: 0; height: 2px; width: 14px; }
      button:disabled { opacity: .6; cursor: default; }
      .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
      .muted { color: #a99a88; font-size: 12px; }
      .small { font-size: 11px; line-height: 1.5; }

      /* Guest list sidebar */
      .guests { position: fixed; right: 12px; top: 56px; width: 270px; max-height: calc(100% - 110px); overflow: auto; z-index: 15;
        background: rgba(16,14,12,.86); border: 1px solid #4a3c2e; border-radius: 6px; padding: 14px; box-sizing: border-box; }
      .guests-head { display: flex; justify-content: space-between; align-items: center; }
      .guests h2 { font-size: 12px; letter-spacing: .14em; color: #d9b98a; margin: 0 0 10px; }
      .guests h3 { font-size: 11px; letter-spacing: .14em; margin: 16px 0 6px; color: #d9b98a; }
      .guests .close, .guests-toggle { display: none; }
      .guests .close { background: none; border: 0; font-size: 22px; padding: 0 4px; }
      .wide { width: 100%; }
      .live { color: #3fd27a; font-size: 9px; margin-left: 6px; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
      .stats div { background: #221d18; border-radius: 4px; padding: 8px 4px; text-align: center; }
      .stats b { display: block; font-size: 20px; color: #f0d6ad; }
      .stats span { font-size: 9px; letter-spacing: .1em; color: #a99a88; text-transform: uppercase; }
      .depts { list-style: none; padding: 0; margin: 12px 0 0; font-size: 11px; }
      .depts li { display: grid; grid-template-columns: 90px 1fr 24px; align-items: center; gap: 6px; margin: 4px 0; }
      .depts span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .depts i { height: 6px; background: #b08a58; border-radius: 3px; }
      .depts b { text-align: right; }
      .names { list-style: none; padding: 0; margin: 0; font-size: 12px; }
      .names li { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px solid #2c251f; }
      .names em { color: #d9b98a; font-style: normal; }
      .names small { color: #a99a88; text-align: right; }

      /* Event details + map */
      .event dl { display: grid; grid-template-columns: 48px 1fr; gap: 6px 8px; margin: 0 0 10px; font-size: 12px; }
      .event dt { font-size: 9px; letter-spacing: .14em; color: #ff6fb5; padding-top: 2px; }
      .event dd { margin: 0; line-height: 1.45; }
      .event dd b { color: #f0d6ad; }
      .event small { color: #a99a88; }
      .map { display: block; border-radius: 6px; overflow: hidden; border: 1px solid #5a2a6e; box-shadow: 0 0 18px rgba(255,47,142,.18); }
      .map svg { display: block; width: 100%; height: auto; }
      .map-links { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 12px; font-size: 10px; color: #a99a88; }
      .map-links a { color: #ff9ccc; text-decoration: none; letter-spacing: .1em; }
      .pin-pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
      @keyframes pulse { from { transform: scale(.4); opacity: .7 } to { transform: scale(2.2); opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .pin-pulse { animation: none; opacity: .3 } }

      /* RSVP form */
      .rsvp { text-align: left; width: min(420px, calc(100vw - 32px)); box-sizing: border-box; }
      .rsvp h1 { font-size: 14px; }
      .rsvp label { display: block; font-size: 12px; color: #d9b98a; margin-bottom: 12px; }
      .rsvp input, .rsvp select { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 9px 10px; font: inherit; font-size: 16px;
        background: #0f0d0b; color: #eee; border: 1px solid #5a4a38; border-radius: 4px; }
      .error { color: #ff8a7a; font-size: 12px; }

      /* Phone controls */
      .touch-layer { position: fixed; inset: 0; z-index: 3; touch-action: none; user-select: none; -webkit-user-select: none; }
      .stick { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.06); pointer-events: none; }
      .knob { position: absolute; left: 31px; top: 31px; width: 48px; height: 48px; border-radius: 50%; background: rgba(240,214,173,.75); }
      .touch-hint { position: absolute; bottom: 24px; left: 0; right: 110px; text-align: center; font-size: 11px; opacity: .7; pointer-events: none; }
      .jump { position: fixed; right: 22px; bottom: 28px; width: 74px; height: 74px; border-radius: 50%; z-index: 4; touch-action: none;
        background: rgba(176,138,88,.55); border-color: rgba(240,214,173,.6); font-weight: 700; }

      @media (max-width: 760px), (pointer: coarse) {
        .bar { left: 8px; right: 8px; top: 8px; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
        .bar button { padding: 7px 10px; font-size: 11px; }
        .guests-toggle { display: inline-block; }
        .guests { display: none; left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 72%; z-index: 25; }
        .guests.open { display: block; }
        .guests .close { display: inline-block; }
        .card { padding: 22px 18px; margin: 0 16px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
